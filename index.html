<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
       <h1 id="hi">hello all</h1>
       <div class="container"></div>
       <h2 id="heading2">I am pandarikaksha</h2>
       <div id="main-container"></div>

</body>
<script>
      let helloall=document.getElementById("hi");
      helloall.style.color="red";
      helloall.style.backgroundColor="blue";
      let container=document.getElementById("main-container");
      let newparagraph=document.createElement("p");
      newparagraph.textContent="this is pandarikaksha from department of IT";
      container.appendChild(newparagraph);
      


      
</script>
