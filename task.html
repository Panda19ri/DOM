<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter</title>
</head>
<style>
    .main{
        text-align: center;
    }
    #decrement{
        padding: 10px;
    }
    #increment{
        padding: 10px;
    }
    #reset{
        padding: 10px;
    }
</style>
<body>
    <div class="main">
        <h1 id="count">0</h1>
        <button id="decrement">-</button>
        <button id="reset">reset</button>
        <button id="increment">+</button>
    </div>
</body>
<script>
       function color(){
        if(c==0){
            countValue.style.backgroundColor="";
        }
        else if(c%2==0){
            countValue.style.backgroundColor="aqua";
        }
        else if(c%2!=0){
            countValue.style.backgroundColor="red";
        }
       }
       function condition1(){
        if(c>10)
       {
        countValue.style.fontSize="80px";
       }
    }
      function condition2() {
         if(c<-10){
             countValue.style.fontSize="20px";
         }
       }
       let c=0;
       let countValue=document.getElementById("count");
       let decrement=document.getElementById("decrement");
       decrement.addEventListener("click",function(){
        c=c-1;
        countValue.innerText=c;
        color();
        condition2();
       });
       let increment=document.getElementById("increment");
       increment.addEventListener("click",function(){
        c=c+1;
        countValue.innerText=c;
        color();
        condition1();
       });
       let reset=document.getElementById("reset");
       reset.addEventListener("click",function(){
        c=0;
        countValue.innerText=c;
        color();
        

       })

       
</script>
</html>
