<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        
        body{
            background-color:darkgray;
            font-family: 'Times New Roman', Times, serif;
            padding:20px;
            display: flex;
            justify-content: center;
        }
        .ToDoMain{
            padding: 20px;
            background-color: darkcyan;
            width: 100%;
            border-radius: 20px;
        }
        .input{
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
           
        }
        
        h1{
            text-align: center;
            margin-bottom: 20px;
            color: red;
        }
        button{
            cursor: pointer;
            border: none;
            padding: 15px;
            background-color: blueviolet;
            color: white;
            border-radius: 20px;
        }
        button:hover{
            background-color:blue;
        }
         ul li{
            list-style: none;
            padding: 10px;
            font-size: 15px;
            cursor: pointer;
        }
        li{
            background: #eee;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .deletebutton {
             background: red;
             border: none;
             color: white;
             padding: 5px 8px;
             cursor: pointer;
             border-radius: 4px;
    }
    </style>
</head>
<body>
    <div class="ToDoMain">
        <h1>To-Do List </h1>
        <!-- <img src="todo.png" width="50" height="50"> -->
        <div class="input">
            <input type="text" id="TaskInput" placeholder="Enter your work here" style="width:1300px; height:40px;">
            <br><br>
            <button onclick="addTask()">Add</button>
        </div>
        <ul id="taskList"></ul>
    </div>
</body>
<script>
    function addTask(){
        const TaskInput=document.getElementById('TaskInput');
        const taskData=TaskInput.value.trim();

        if (taskData === "") {
        alert("enter a task");
        return;
      }

        let li=document.createElement("li");
        //template literals
        li.innerHTML= `${taskData} <button class="delete-button" onclick="deleteTask(this)">Delete</button> `; 

        li.addEventListener("click", function(){
            this.classList.toggle("done");
        });
        document.getElementById("taskList").appendChild(li);
        TaskInput.value=" ";

    }
    function deleteTask(button){
          button.parentElement.remove();
    }
</script>
</html>
